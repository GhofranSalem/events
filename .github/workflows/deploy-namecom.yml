# Uploads the website to the Name.com hosting over FTP every time main changes.
# The FTP account is locked to the vevents.sa folder (public_html/vevents.sa/), so its root IS the site root.
# The FTP details live in this repository's secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    the FTP host from the Name.com hosting panel
#   FTP_USERNAME  the FTP / cPanel user
#   FTP_PASSWORD  its password
# Until those three secrets exist, the upload step is skipped instead of failing.
name: Deploy to Name.com

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: deploy-namecom
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      # Dashboard (vevents.sa/admin): users and the GitHub token come from the
      # ADMIN_USERS and ADMIN_GITHUB_TOKEN secrets and are written to admin/config.php on the server only.
      - name: Write dashboard settings
        if: env.FTP_SERVER != ''
        env:
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: php .github/scripts/admin-config.php > admin/config.php

      - name: Upload site to the vevents.sa folder
        id: upload
        if: env.FTP_SERVER != ''
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            CLAUDE.md
            admin/users.php

      # The FTP server sometimes drops the connection; try once more before failing.
      - name: Upload site again (only if the first try failed)
        if: env.FTP_SERVER != '' && steps.upload.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            CLAUDE.md
            admin/users.php

      - name: FTP details not set yet
        if: env.FTP_SERVER == ''
        run: echo "Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD in Settings > Secrets and variables > Actions, then run this workflow again."
